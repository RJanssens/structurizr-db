spring:
  application:
    name: structurizr-architecture-scanner

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:architecturedb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.structurizr.scanner: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# GitLab Configuration (to be used by scanner component)
gitlab:
  url: ${GITLAB_URL:http://localhost}
  token: ${GITLAB_TOKEN:}
  default-branch: ${GITLAB_DEFAULT_BRANCH:development}

# Application-specific settings
scanner:
  max-concurrent-scans: ${MAX_CONCURRENT_SCANS:5}
  scan-timeout-minutes: ${SCAN_TIMEOUT_MINUTES:10}
